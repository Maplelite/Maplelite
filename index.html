<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>
#site{--o:#ff9a2e;--d:#1e2f5c;--wd:#2a68c8;--wl:#4aa0f0;--pp:#eef6ff;position:relative;overflow:hidden;font-family:Maplestory,Arial,sans-serif;color:#1e2f5c;min-height:100vh;background:linear-gradient(#3f86d6 0,#7ec0f0 38%,#c9ecff 62%,#f6e9b8 100%)}
#site *{box-sizing:border-box}#site a{color:inherit;text-decoration:none}
.ws-sun{position:absolute;top:-120px;right:8%;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0,#ffe98a 28%,rgba(255,233,138,0) 68%);animation:wsg 6s ease-in-out infinite}
@keyframes wsg{50%{transform:scale(1.08);opacity:.85}}
.ws-cl{position:absolute;height:56px;width:170px;background:#fff;border-radius:60px;opacity:.9;filter:drop-shadow(0 6px 0 rgba(120,170,220,.35));animation:wsc linear infinite;left:-220px}
.ws-cl:before,.ws-cl:after{content:"";position:absolute;background:#fff;border-radius:50%}.ws-cl:before{width:80px;height:80px;left:24px;top:-38px}.ws-cl:after{width:62px;height:62px;left:80px;top:-26px}
@keyframes wsc{to{transform:translateX(calc(100vw + 480px))}}
.ws-lf{position:absolute;top:-40px;font-size:22px;animation:wsl linear infinite;opacity:.9;pointer-events:none}
@keyframes wsl{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(40px,50vh) rotate(180deg)}100%{transform:translate(-20px,105vh) rotate(380deg)}}
.ws-bar{position:relative;z-index:30;background:none;border:0;box-shadow:none}
.ws-bar>div{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ws-mini{font:900 28px/1 Maplestory,Arial,sans-serif;letter-spacing:2px;color:#ffb938;-webkit-text-stroke:4px var(--d);paint-order:stroke fill;text-shadow:0 3px 0 var(--d)}
.ws-nav{display:flex;gap:6px;flex:1}.ws-nav a{padding:7px 14px;border-radius:10px;font-weight:700;font-size:14px;color:#ffffff;text-shadow:0 2px 0 var(--d);transition:.15s}.ws-nav a:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.ws-acct{display:flex;align-items:center;gap:8px;font-size:14px;color:#ffffff;text-shadow:0 2px 0 var(--d)}
#site .ws-b{font:700 14px Maplestory,Arial,sans-serif;border:3px solid var(--d);background:linear-gradient(#fff,#e6ddc4);color:#1e2f5c;border-radius:12px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 var(--d);text-shadow:none;transition:.12s}
#site .ws-b.p{background:linear-gradient(#ffd067,#ff9a2e)}#site .ws-b:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--d)}#site .ws-b:active{transform:translateY(2px);box-shadow:0 1px 0 var(--d)}
.ws-hero{position:relative;text-align:center;padding:60px 16px 150px;color:#fff;z-index:2}
.ws-logo{position:relative;display:block;width:fit-content;max-width:100%;margin:0 auto;text-align:center;font:900 clamp(76px,19vw,176px)/1.05 Maplestory,'Arial Black',Impact,sans-serif;letter-spacing:.05em;color:#ffb938;-webkit-text-stroke:9px var(--d);paint-order:stroke fill;text-shadow:0 10px 0 var(--d),0 22px 26px rgba(30,20,60,.45);animation:wsh 3.4s ease-in-out infinite}
@keyframes wsh{50%{transform:translateY(-8px) rotate(-1deg)}}
.ws-logo i{font-style:normal;display:block;font-size:.5em;line-height:1;margin:0 0 4px;-webkit-text-stroke:0;text-shadow:none;animation:wsr 5s linear infinite}
@keyframes wsr{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.ws-tag{display:inline-block;margin:26px auto 0;max-width:600px;font-size:18px;padding:8px 22px;border-radius:30px;background:rgba(30,47,92,.55);border:2px solid rgba(255,255,255,.5);text-shadow:0 2px 3px rgba(0,0,0,.5)}
.ws-playw{position:relative;display:inline-block;margin-top:32px}
#site .ws-play{position:relative;overflow:hidden;font:900 clamp(30px,6vw,50px) Maplestory,Arial,sans-serif;padding:16px 70px;border-radius:26px;border:6px solid var(--d);color:#fff;text-shadow:0 4px 0 #e8730c;background:linear-gradient(#ffc84d 0,#ff9a2e 55%,#ff7414 100%);box-shadow:0 10px 0 var(--d),0 22px 34px rgba(30,20,5,.45),inset 0 4px 0 rgba(255,255,255,.55);cursor:pointer;animation:wsp 1.8s ease-in-out infinite;letter-spacing:1px}
#site .ws-play:before{content:"";position:absolute;top:0;bottom:0;width:60px;left:-90px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:wss 3s ease-in-out infinite}
@keyframes wss{60%,100%{left:120%}}@keyframes wsp{50%{transform:scale(1.05)}}
#site .ws-play:hover{filter:brightness(1.08)}#site .ws-play:active{transform:translateY(7px);box-shadow:0 3px 0 var(--d)}
.ws-sp{position:absolute;font-size:26px;animation:wst 1.6s ease-in-out infinite}.ws-sp.a{left:-34px;top:-14px}.ws-sp.b{right:-30px;bottom:-12px;animation-delay:.6s}.ws-sp.c{right:8px;top:-24px;font-size:18px;animation-delay:1s}
@keyframes wst{50%{transform:scale(1.4) rotate(20deg);opacity:.6}}
.ws-sub{margin-top:24px;font-size:14px;text-shadow:0 2px 3px rgba(0,0,0,.6)}.ws-sub a{text-decoration:underline;cursor:pointer;font-weight:700}
.ws-hills{position:absolute;left:0;right:0;bottom:-2px;height:190px;z-index:1;pointer-events:none}.ws-hills svg{width:100%;height:100%;display:block}
.ws-mobs{position:absolute;left:0;right:0;bottom:22px;height:48px;z-index:2;pointer-events:none}
.ws-mob{position:absolute;bottom:0;font-size:34px;left:-60px;animation:wsm linear infinite;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
@keyframes wsm{to{transform:translateX(calc(100vw + 120px))}}
.ws-wrap{position:relative;z-index:3;max-width:1080px;margin:-30px auto 0;padding:0 16px 40px;display:grid;grid-template-columns:2fr 1fr;gap:22px;background:linear-gradient(#5aa63f,#3f8a30 40px) top/100% 1px no-repeat}
@media(max-width:780px){.ws-wrap{grid-template-columns:1fr}.ws-nav{order:3;flex-basis:100%;justify-content:center}.ws-hero{padding-top:50px}}
.ws-card{position:relative;background:linear-gradient(#ffffff,var(--pp));border:4px solid var(--d);border-radius:20px;padding:30px 20px 16px;box-shadow:0 8px 0 var(--d),0 18px 28px rgba(30,20,5,.25),inset 0 0 0 3px #cfe4fa;margin-bottom:34px}
.ws-card h2{position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;margin:0;padding:6px 20px;font:900 20px Maplestory,Arial,sans-serif;color:#fff;text-shadow:0 2px 0 var(--d);background:linear-gradient(#5bb4ff,#2f74d0);border:3px solid var(--d);border-radius:12px;box-shadow:0 4px 0 var(--d)}
.ws-item{display:flex;gap:12px;padding:12px 0;border-top:2px dotted #c6dcf2}.ws-item:first-of-type{border-top:0;padding-top:0}
.ws-ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(#ffe9a8,#ffc956);border:3px solid var(--d);box-shadow:0 3px 0 var(--d)}
.ws-item b{display:block;font-size:16px;color:#1f3b6b}.ws-item p{margin:3px 0 0;font:14px/1.45 Georgia,serif;color:#44587a}
.ws-tagc{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#3f8fe0;border:2px solid var(--d);border-radius:8px;padding:0 7px;margin-right:7px;vertical-align:1px;text-shadow:0 1px 0 rgba(0,0,0,.4)}.ws-tagc.e{background:#3d9a3a}.ws-tagc.s{background:#c9601c}
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ws-st{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 4px;border-radius:14px;background:linear-gradient(#fff,#e3effc);border:2px solid #c6dcf2;font-size:12px;color:#6b7f9e}.ws-st.w{grid-column:1/-1}
.ws-st em{font-style:normal;font-size:20px;line-height:1.2}.ws-st b{font:900 18px Maplestory,Arial,sans-serif;color:#1f3b6b}
.ws-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#3dc03a;margin-right:6px;box-shadow:0 0 0 3px rgba(61,192,58,.3);animation:wsd 1.6s infinite}@keyframes wsd{50%{box-shadow:0 0 0 7px rgba(61,192,58,0)}}
.ws-note{font:12px/1.4 Georgia,serif;color:#6b7f9e;margin-top:12px}
.ws-foot{position:relative;z-index:3;text-align:center;color:#ffffff;font-size:13px;padding:26px 16px 30px;background:linear-gradient(#3f8a30,#2c6a22);border-top:5px solid var(--d);text-shadow:0 2px 0 rgba(0,0,0,.4)}
#ws-home{position:fixed;top:8px;left:8px;z-index:50;display:none;font:700 13px Maplestory,Arial,sans-serif;border:3px solid #1e2f5c;background:linear-gradient(#fff,#e6ddc4);border-radius:12px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 #1e2f5c}
html{scroll-behavior:smooth}#site section{scroll-margin-top:90px}
@media(prefers-reduced-motion:reduce){#site *{animation:none!important}}
</style><style>
.ws-av{position:relative;z-index:3;max-width:1080px;margin:0 auto;padding:46px 16px 50px}
.ws-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 -4px 12px;position:relative;z-index:2}
#site .ws-tab{font:700 15px Maplestory,Arial,sans-serif;padding:9px 20px 12px;border:4px solid var(--d);border-bottom:0;border-radius:14px 14px 0 0;background:linear-gradient(#5bb4ff,#2f74d0);color:#ffffff;text-shadow:0 2px 0 var(--d);cursor:pointer}
#site .ws-tab.on{background:linear-gradient(#ffffff,#eef6ff);color:#1f3b6b;text-shadow:none}
.ws-av .ws-card{margin-bottom:0;padding-top:20px;border-radius:20px}
.ws-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:2px dotted #c6dcf2;font-size:15px}.ws-row:first-child{border-top:0}
.ws-row small{display:block;font:12px Georgia,serif;color:#6b7f9e}.ws-row b{color:#1f3b6b}
.ws-h3{font:900 17px Maplestory,Arial,sans-serif;color:#e8730c;margin:16px 0 4px}.ws-h3:first-child{margin-top:0}
.ws-f{display:grid;gap:8px;max-width:380px;margin:8px 0}.ws-f label{font-size:13px;font-weight:700;color:#1f3b6b}
.ws-f input{width:100%;font:15px Georgia,serif;padding:9px 11px;border:3px solid #4aa0f0;border-radius:10px;background:#fff;color:#1e2f5c}
.ws-m{font:13px Georgia,serif;min-height:18px}.ws-m.bad{color:#c0392b}.ws-m.ok{color:#2f8a2a}
.ws-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ws-sl{background:linear-gradient(#fff,#e3effc);border:3px solid #c6dcf2;border-radius:16px;padding:12px;text-align:center}.ws-sl.f{border-color:var(--d)}
.ws-sl .a{font-size:34px}.ws-sl b{display:block;font:900 17px Maplestory,Arial,sans-serif;color:#1f3b6b}.ws-sl small{display:block;font:12px Georgia,serif;color:#6b7f9e;margin:2px 0 8px}
.ws-sl .ws-b{padding:5px 10px;font-size:13px;margin:2px}
.ws-sw{position:relative;flex:none;width:52px;height:28px;border-radius:20px;border:3px solid var(--d);background:#b8c4d6;cursor:pointer;padding:0}
.ws-sw:after{content:"";position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--d);transition:.15s}
.ws-sw.on{background:#3dc03a}.ws-sw.on:after{left:25px}
#site .ws-b.d{background:linear-gradient(#ff8a7a,#d9463a);color:#fff}
#site.ws-noleaf .ws-lf{display:none}#site.ws-noanim *{animation:none!important}
</style><style>
/* game-style buttons (same as map and chat buttons in the game) */
#site .ws-b,#site .ws-nav a,#site .ws-tab,#ws-home{font:700 13px Maplestory,Arial,Tahoma,sans-serif;color:#243552;background:linear-gradient(#fff,#cddbee);border:1px solid #5a77a3;border-radius:4px;box-shadow:inset 0 1px 0 #fff;padding:6px 14px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-shadow:none;transform:none;transition:none;cursor:pointer;text-decoration:none;margin:0}
#site .ws-b:hover,#site .ws-nav a:hover,#site .ws-tab:hover{background:linear-gradient(#fff,#dbe7f7);border-color:#f28b0e;transform:none;box-shadow:inset 0 1px 0 #fff;filter:none}
#site .ws-b:active,#site .ws-nav a:active,#site .ws-tab:active{background:linear-gradient(#c3d3e9,#e3ecf8);box-shadow:inset 0 1px 3px rgba(0,0,0,.25);transform:none}
#site .ws-b.p{background:linear-gradient(#ffd45e,#f39a14);border-color:#a85e08;color:#fff;text-shadow:0 1px 0 #8a4400;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 0 #7a4208}
#site .ws-b.p:hover{background:linear-gradient(#ffe07a,#f6a526);border-color:#a85e08}
#site .ws-nav a.on,#site .ws-tab.on{background:#2f6fb8;border-color:#1f4f88;color:#fff;text-shadow:none;box-shadow:none}
#site .ws-b.d{background:linear-gradient(#ff9a8a,#d9463a);border-color:#8f2a22;color:#fff;text-shadow:0 1px 0 #7a1f18}
#site .ws-b.d:hover{border-color:#f28b0e}
#site .ws-sl .ws-b{min-height:30px;padding:3px 10px}
.ws-bar>div{justify-content:center;gap:6px;padding:8px 12px}
.ws-nav{flex:none;gap:6px;justify-content:center}.ws-acct{gap:6px}
@media(max-width:780px){.ws-nav{order:0;flex-basis:auto}}
.ws-tabs{gap:6px;margin:0 0 14px}
/* bigger logo */
.ws-logo{font-size:clamp(64px,17.5vw,240px);letter-spacing:.04em}
.ws-hero{padding-top:46px}
</style><style>
.ws-logo{z-index:3;cursor:pointer;padding-top:.42em;padding-left:.04em;margin-left:auto;margin-right:auto;margin-bottom:6px;text-align:center}
.ws-bar>div{flex-wrap:nowrap;overflow-x:auto;justify-content:safe center;scrollbar-width:none}.ws-bar>div::-webkit-scrollbar{display:none}
.ws-nav,.ws-acct{flex-wrap:nowrap;flex:none}
#site .ws-b,#site .ws-nav a{white-space:nowrap;flex:none}
.ws-acct span{white-space:nowrap}
.ws-hero{padding-top:18px}
@media(max-width:780px){#site .ws-b,#site .ws-nav a{padding:6px 9px;font-size:12px}.ws-acct span{display:none}.ws-bar>div{gap:4px;padding:8px 8px}.ws-nav,.ws-acct{gap:4px}}
/* header: nav buttons share the full width */
.ws-bar>div{max-width:none;flex-wrap:nowrap;overflow:visible;justify-content:stretch}
.ws-nav{flex:1 1 0;justify-content:stretch}.ws-nav a{flex:1 1 0;min-width:0;text-align:center}
#site .ws-nav a{flex:1 1 0;min-width:0}.ws-acct:empty{display:none}

:root{--bg:#8fbde3;--panel:#f7f4ea;--panel2:#e9e4d3;--line:#b8b29a;--tx:#2e2819;--mute:#7a725d;--hp:#e0503a;--mp:#3f8fe0;--xp:#f5a623;--ok:#3d7a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:#8fbde3 linear-gradient(#5b97d1,#c3dff3) fixed;color:var(--tx);font:15px/1.4 Georgia,'Times New Roman',serif}
#app{max-width:520px;margin:0 auto;padding:10px 10px 38px}
.xpb{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);background:#2b2820;border-top:1px solid #1a1812}.xpi{position:relative;max-width:520px;margin:0 auto;height:18px;background:#4a463c;overflow:hidden}.xpi i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffcf5a,#f5a623);transition:width .2s}.xpi span{position:relative;display:block;text-align:center;font:bold 11px/18px Maplestory,Arial,sans-serif;color:#fff;text-shadow:0 1px 2px #000}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar{height:12px;background:#4a463c;border-radius:6px;overflow:hidden;margin:3px 0 6px}
.bar>i{display:block;height:100%;transition:width .15s}
button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--xp)}button:disabled{opacity:.45;cursor:default}
button.main{background:#f08a24;border-color:#c46a0f;color:#fff;font-weight:bold}
.wm{position:relative;height:250px;margin:6px 10px 22px}.wm svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.nd{position:absolute;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;font-size:22px;line-height:1;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;background:#e9e4d3}
.nd span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;font:bold 11px Maplestory,Arial,sans-serif;white-space:nowrap;color:var(--tx);text-shadow:0 0 3px var(--panel)}
.nd.here{border:3px solid #f08a24;background:#fff3d6;box-shadow:0 0 0 4px rgba(240,138,36,.3)}
.nd.ok{border:2px solid #2f6fb8;background:#fff;box-shadow:0 0 0 4px rgba(47,111,184,.25)}
.nd.far,.nd.lock{opacity:.5}
.doll .eqs{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:2px;background:#fff;border:2px solid #2f6fb8;border-radius:4px;font-size:22px}.doll .emp{opacity:.7}.doll .eqs small{text-align:center;line-height:1.1;max-width:100%}
.mcard{background:#f7f4ea;border:2px solid #b8b29a;border-radius:12px;padding:12px;margin-top:8px}.mh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mi{font-size:36px;width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;background:#e2dcc6;border:1px solid #b8b29a;border-radius:8px}
.mr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e0dac6;font-size:14px}.mcard .ex button{flex:1}
.seg{display:flex;gap:4px}.seg button{min-height:30px;padding:2px 14px}.seg .on{background:#2f6fb8;border-color:#1f4f88;color:#fff}
